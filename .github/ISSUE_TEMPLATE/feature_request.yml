name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that soapbar doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? Include an API sketch if you have one.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Which SOAP service / spec section / interop target motivates this? (e.g. a WSDL fragment, a WS-* spec reference)
