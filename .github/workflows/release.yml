name: Release — Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  # Dispatched by release-please.yml after it cuts a release (tags created
  # with GITHUB_TOKEN do not fire the push trigger above). Also serves as the
  # manual re-run path for an existing tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish (e.g. v0.16.0)"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: read
  id-token: write  # required for OIDC trusted publishing

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests (must pass before publish)
        run: uv run pytest tests/ --no-cov -q

      - name: Build wheel and sdist
        run: uv build

      - name: Generate SBOM (CycloneDX, runtime dependencies)
        # From the frozen lockfile, runtime graph only (no dev groups, no
        # project itself) — the dependency inventory of the shipped package.
        # Kept out of dist/ so the PyPI publish step never sees it.
        run: |
          uv export --frozen --no-dev --no-emit-project -o sbom-requirements.txt
          mkdir -p sbom
          uvx --from cyclonedx-bom==7.3.1 cyclonedx-py requirements sbom-requirements.txt \
            --of JSON -o "sbom/soapbar-${RELEASE_TAG#v}.cdx.json"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: sbom/
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/soapbar/
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          # Idempotent re-runs: a version already on PyPI is skipped instead
          # of failing the job (e.g. re-running to regenerate release assets).
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create/edit the GitHub Release and upload assets
      id-token: write      # sign the provenance attestation (Sigstore)
      attestations: write  # store the attestation in the GitHub store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom
          path: sbom/

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*
            sbom/*

      - name: Create or update GitHub Release from CHANGELOG section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # CHANGELOG sections start with `## [X.Y.Z] — DATE`. Grab the
          # lines from the matching header up to (but not including) the
          # next `## [` header. Use a fixed-string match (index) to avoid
          # regex metacharacter interpretation of the version's dots.
          python3 - <<PY > release-notes.md
          import sys
          version = "${VERSION}"
          header = f"## [{version}]"
          lines = open("CHANGELOG.md").read().splitlines()
          out, grab = [], False
          for line in lines:
              if not grab and line.startswith(header):
                  grab = True
                  out.append(line)
              elif grab and line.startswith("## ["):
                  break
              elif grab:
                  out.append(line)
          sys.stdout.write("\n".join(out))
          PY
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for ${VERSION}"
            exit 1
          fi
          # release-please creates the GitHub Release before this workflow is
          # dispatched; replace its generated notes with the curated CHANGELOG
          # section. On the manual tag-push path no release exists yet: create.
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "${TAG}" \
              --notes-file release-notes.md
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file release-notes.md
          fi

      - name: Attach dist, SBOM, and provenance bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        # The .sigstore.json suffix is what verification tooling (and the
        # Scorecard Signed-Releases check) recognizes as a signature bundle —
        # artifacts must never be attached without it.
        run: |
          set -euo pipefail
          cp "${BUNDLE}" "soapbar-${TAG#v}-provenance.sigstore.json"
          gh release upload "${TAG}" --clobber \
            dist/* \
            sbom/* \
            "soapbar-${TAG#v}-provenance.sigstore.json"
