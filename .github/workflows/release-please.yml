name: Release Please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain release PR / cut release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the release PR branch, create tag + GitHub Release
      pull-requests: write  # open/update the release PR
      actions: write        # dispatch release.yml after a release is cut
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps pyproject.toml but not the project's own version
      # recorded in uv.lock; regenerate the lockfile on the release PR branch
      # so the release commit is internally consistent.
      - name: Check out release PR branch
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - name: Install uv
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "latest"

      - name: Sync uv.lock with the bumped version
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          set -euo pipefail
          uv lock
          if ! git diff --quiet -- uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: sync uv.lock with release version"
            git push origin "HEAD:${BRANCH}"
          fi

      - name: Trigger PyPI publish workflow
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        # Tags created with GITHUB_TOKEN do not fire `on: push: tags`
        # (anti-recursion), but workflow_dispatch is a documented exception —
        # so release.yml keeps its PyPI trusted-publisher binding unchanged.
        run: gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" -f tag="${TAG}"
