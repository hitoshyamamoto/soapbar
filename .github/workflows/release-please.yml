name: Release Please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain release PR / cut release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the release PR branch, create tag + GitHub Release
      pull-requests: write  # open/update the release PR
      actions: write        # dispatch release.yml after a release is cut
    steps:
      # Release PRs created with the default GITHUB_TOKEN get CI runs stuck in
      # action_required (manual "Approve and run"). A GitHub App token avoids
      # that. Optional: when the app is not configured (variable unset), the
      # step is skipped and everything falls back to GITHUB_TOKEN.
      - name: Mint GitHub App token
        id: app-token
        if: ${{ vars.RELEASE_BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps pyproject.toml but not the project's own version
      # recorded in uv.lock; regenerate the lockfile on the release PR branch
      # so the release commit is internally consistent.
      - name: Check out release PR branch
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # `|| '{}'`: expressions in `with`/`env` are evaluated even for
          # skipped steps, so guard against the output being empty.
          ref: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
          # Push the uv.lock sync with the app token too: pushes made with
          # GITHUB_TOKEN don't trigger the PR's CI (anti-recursion), which
          # would leave the release PR's head commit without required checks.
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Install uv
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "latest"

      - name: Sync uv.lock with the bumped version
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
        run: |
          set -euo pipefail
          uv lock
          if ! git diff --quiet -- uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: sync uv.lock with release version"
            git push origin "HEAD:${BRANCH}"
          fi

      - name: Trigger PyPI publish workflow
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        # Tags created with GITHUB_TOKEN do not fire `on: push: tags`
        # (anti-recursion), but workflow_dispatch is a documented exception —
        # so release.yml keeps its PyPI trusted-publisher binding unchanged.
        # Dispatch on the tag ref: the pypi environment's deployment policy
        # only allows deployments from v* tags, not branches.
        run: gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref "refs/tags/${TAG}" -f tag="${TAG}"
