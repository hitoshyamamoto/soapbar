name: CI — Pull Request

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write   # needed to post the coverage summary comment

jobs:
  # ── 1. Lint & type-check ──────────────────────────────────────────────────
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install lint + type dependencies
        run: uv sync --group lint --group type

      - name: Ruff lint
        run: uv run ruff check src/ tests/ examples/

      - name: Mypy type check
        run: uv run mypy src/ --strict

  # ── 2. Test matrix ────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: quality
    runs-on: ubuntu-latest
    # A healthy matrix leg finishes in about a minute; anything past this is a
    # hung runner, not a slow test suite.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install xmlsec system libraries
        # `apt-get update` first: the runner image ships a stale package index
        # that can pin a since-superseded version (e.g. libnss3-dev), which then
        # 404s at download time and fails the whole job. Refreshing the index
        # resolves the current versions.
        #
        # Bounded and retried: on 2026-10-07 several jobs sat in this step for
        # over 30 minutes — an apt mirror that accepted the connection and then
        # stalled, which apt waits on indefinitely by default. A stalled fetch
        # now gives up after 30 s, apt retries it, the whole step retries up to
        # three times, and the step itself cannot run past five minutes, so an
        # infrastructure hiccup fails fast (and can be re-run) instead of
        # pinning a runner for the six-hour job default.
        timeout-minutes: 5
        run: |
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          for attempt in 1 2 3; do
            if sudo apt-get "${apt_opts[@]}" update \
               && sudo apt-get "${apt_opts[@]}" install -y \
                    libxml2-dev libxmlsec1-dev libxmlsec1-openssl pkg-config; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} failed; retrying in 15 s"
            sleep 15
          done
          echo "::error::apt failed after 3 attempts"
          exit 1

      - name: Install dev dependencies
        run: uv sync --group dev --group crypto-interop

      - name: Run tests with coverage
        run: uv run pytest tests/ -q --cov=soapbar --cov-report=xml --cov-report=term-missing

      - name: Upload coverage data
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-pr-${{ github.event.pull_request.number }}
          path: .coverage
          include-hidden-files: true   # .coverage is dotfile-hidden; excluded by default
          retention-days: 7

  # ── 3. Examples smoke test ───────────────────────────────────────────────
  examples:
    name: Examples
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dev + examples dependencies
        run: uv sync --group dev --group examples

      - name: Run example smoke tests
        run: uv run pytest tests/test_examples.py -v --no-cov

  # ── 4. Coverage summary comment on PR ────────────────────────────────────
  coverage-comment:
    name: Coverage Summary
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write        # update the python-coverage-comment-action-data branch + edit prior comment
      pull-requests: write   # post the coverage comment on trusted same-repo PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage-pr-${{ github.event.pull_request.number }}

      - name: Post coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f  # v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}

      # Dependabot / fork PRs run with a read-only token, so the step above
      # cannot post directly and instead writes the comment to a file. Store it
      # so the trusted coverage-comment.yml (workflow_run) can publish it.
      - name: Store comment for later publication
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
          retention-days: 1
