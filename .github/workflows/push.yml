name: CI — Push

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # ── 1. Lint & type-check ──────────────────────────────────────────────────
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install lint + type dependencies
        run: uv sync --group lint --group type

      - name: Ruff lint
        run: uv run ruff check src/ tests/ examples/

      - name: Mypy type check
        run: uv run mypy src/ --strict

  # ── 2. Test matrix ────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: quality
    runs-on: ubuntu-latest
    # A healthy matrix leg finishes in about a minute; anything past this is a
    # hung runner, not a slow test suite.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install xmlsec system libraries
        # `apt-get update` first: the runner image ships a stale package index
        # that can pin a since-superseded version (e.g. libnss3-dev), which then
        # 404s at download time and fails the whole job. Refreshing the index
        # resolves the current versions.
        #
        # Bounded and retried: on 2026-10-07 several jobs sat in this step for
        # over 30 minutes — an apt mirror that accepted the connection and then
        # stalled, which apt waits on indefinitely by default. A stalled fetch
        # now gives up after 30 s, apt retries it, the whole step retries up to
        # three times, and the step itself cannot run past five minutes, so an
        # infrastructure hiccup fails fast (and can be re-run) instead of
        # pinning a runner for the six-hour job default.
        timeout-minutes: 5
        run: |
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          for attempt in 1 2 3; do
            if sudo apt-get "${apt_opts[@]}" update \
               && sudo apt-get "${apt_opts[@]}" install -y \
                    libxml2-dev libxmlsec1-dev libxmlsec1-openssl pkg-config; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} failed; retrying in 15 s"
            sleep 15
          done
          echo "::error::apt failed after 3 attempts"
          exit 1

      - name: Install dev dependencies
        run: uv sync --group dev --group crypto-interop

      - name: Run tests with coverage
        run: uv run pytest tests/ -q --cov=soapbar --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report (Python 3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ── 3. Examples smoke test ───────────────────────────────────────────────
  examples:
    name: Examples
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dev + examples dependencies
        run: uv sync --group dev --group examples

      - name: Run example smoke tests
        run: uv run pytest tests/test_examples.py -v --no-cov
