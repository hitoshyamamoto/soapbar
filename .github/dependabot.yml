version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        patterns: ["pytest*", "coverage*", "ruff", "mypy", "types-*"]
      security-libs:
        patterns: ["cryptography", "signxml"]
    labels: ["dependencies", "python"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Group ALL action bumps into one PR. Critical for github/codeql-action:
      # its init/analyze/upload-sarif sub-actions must stay on the same version
      # (init writes a config the analyze step must match), so bumping them in
      # separate PRs breaks CodeQL until every PR merges. A single grouped PR
      # keeps them in lockstep and cuts PR noise.
      github-actions:
        patterns: ["*"]
    labels: ["dependencies", "github-actions"]
