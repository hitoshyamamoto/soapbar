site_name: soapbar
site_description: "A SOAP library for Python — client, server, and WSDL handling."
site_url: https://hitoshyamamoto.github.io/soapbar/
repo_url: https://github.com/hitoshyamamoto/soapbar

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

# Declaring `plugins` disables the defaults, so `search` must be re-listed.
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            # Docstrings use reST field lists (:param:, :raises:) — the
            # "sphinx" parser understands them.
            docstring_style: sphinx
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            show_source: false
            show_root_heading: false
            # Hide private names, but keep the public __version__ export
            # (last matching filter wins).
            filters: ["!^_", "^__version__$"]

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Guide:
      - Server and frameworks: server.md
      - Client: client.md
      - WSDL: wsdl.md
      - Type system and encoding: types.md
      - Faults and one-way operations: faults.md
      - Security: security.md
  - Reference:
      - API reference: api.md
      - Interoperability: interoperability.md
      - Real-world services: real-world.md
      - Architecture and public API: architecture.md
      - Comparison with alternatives: comparison.md
      - Known limitations: limitations.md
  - Contributing: contributing.md
